# OPTIONAL: Use only if you want to trigger Cloud Build directly.
# If you intend to test PlatformNEX's Cloud Build setup generator,
# delete this file before pushing the repo.
#
# This example builds and pushes an image to Artifact Registry and 
# (optionally) deploys to Cloud Run if substitutions are provided.

substitutions:
  _REGION: "us-central1"
  _REPO: "platformnex"
  _IMAGE: "platformnex-cloudbuild-test"
  _SERVICE_NAME: "platformnex-cloudbuild-test"
  _PROJECT_ID: "${PROJECT_ID}"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:$SHORT_SHA", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:$SHORT_SHA"]

  # Uncomment to deploy to Cloud Run (requires services enabled & permissions)
  # - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
  #   entrypoint: gcloud
  #   args:
  #     - run
  #     - deploy
  #     - "${_SERVICE_NAME}"
  #     - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:$SHORT_SHA"
  #     - "--region=${_REGION}"
  #     - "--platform=managed"
  #     - "--allow-unauthenticated"

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_IMAGE}:$SHORT_SHA"